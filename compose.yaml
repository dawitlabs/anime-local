services:
  yoru:
    build: .
    init: true
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${PORT:-4173}:4173'
    environment:
      HOST: 0.0.0.0
      PORT: 4173
      MEDIA_DIR: /app/media
      CACHE_DIR: /app/.cache/streams
      CACHE_MAX_MB: ${CACHE_MAX_MB:-512}
      TRANSCODE_WORKERS: ${TRANSCODE_WORKERS:-2}
      TORRENT_DIR: /app/data/torrents
      TORRENT_MAX_GB: ${TORRENT_MAX_GB:-20}
      CATALOG_URL: ${CATALOG_URL:-https://anime-kitsu.strem.fun}
      SOURCES_URL: ${SOURCES_URL:-https://torrentio.strem.fun}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
    volumes:
      - ${MEDIA_DIR:-./media}:/app/media:ro
      - stream-cache:/app/.cache/streams
      - torrent-data:/app/data/torrents
    restart: unless-stopped
volumes:
  stream-cache:
  torrent-data:
